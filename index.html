<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madam Fav | Ambient Player</title>
  
  <!-- Link to external CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <div class="mode-btn">MODE: TAYLOR'S VERSION</div>

  <div class="ui-container">
    <h1>Madam Fav</h1>
    
    <div class="glass-card">
      <div class="subtitle">Taylor's Version • ambient player</div>
      <div class="song-title" id="current-title">Loading...</div>
      
      <div class="progress-container">
        <span id="time-current">0:00</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span id="time-total">0:00</span>
      </div>

      <div class="controls">
        <button id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        
        <button class="btn-play" id="playPauseBtn" aria-label="Play/Pause">
          <!-- Play Icon -->
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <!-- Pause Icon (Hidden by default) -->
          <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        
        <button id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <div class="bottom-text">Folklore - 20 &nbsp;&nbsp;&nbsp; 1989 - 20</div>
  </div>

  <!-- Hidden YouTube Player Engine -->
  <div id="player"></div>

  <!-- Link to external JavaScript -->
  <script src="script.js"></script>
</body>
</html>
